app = "vinpop-bot"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[processes]
  app = "python main.py"

[[mounts]]
  source = "vinpop_data"
  destination = "/data"

[env]
  DATABASE_PATH = "/data/tracker.db"
  LOG_LEVEL = "INFO"

[[restart]]
  policy = "always"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
